name: Unit test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  bats:
    name: Run unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      database:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bats
        uses: mig4/setup-bats@v1

      - name: Setup PHP v8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, intl, php-mysql

      - name: Install wp tests
        run: bash test/bin/install-wp-tests.sh wordpress_test root root 0.0.0.0:3306 $WP_VERSION

      - name: Run Bats test
        run: bats test
